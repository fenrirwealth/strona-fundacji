server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /404.html {
        internal;
    }

    # Strona główna jest serwowana bezpośrednio, aby /index.html mogło być przekierowane.
    location = / {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        return 301 /;
    }

    # Kanoniczny adres archiwum.
    location = /archiwum {
        alias /usr/share/nginx/html/archiwum.html;
        add_header Cache-Control "no-cache";
    }

    location = /archiwum.html {
        return 301 /archiwum;
    }

    location = /archiwum/index.html {
        return 301 /archiwum;
    }

    location = /archiwum/ {
        return 301 /archiwum;
    }

    # Kanoniczny adres strony akcji Mikołajowej.
    location = /listy-do-swietego-mikolaja {
        alias /usr/share/nginx/html/listy-do-swietego-mikolaja.html;
        add_header Cache-Control "no-cache";
    }

    location = /listy-do-swietego-mikolaja.html {
        return 301 /listy-do-swietego-mikolaja;
    }

    location = /listy-do-swietego-mikolaja/ {
        return 301 /listy-do-swietego-mikolaja;
    }

    # Każdy materiał archiwalny ma jeden czysty adres URL.
    location ~ ^(/archiwum/[^/]+)/index\.html$ {
        return 301 $1;
    }

    location ~ ^(/archiwum/[^/]+)/$ {
        return 301 $1;
    }

    location ~ ^/archiwum/(?<archive_slug>[^/]+)$ {
        alias /usr/share/nginx/html/archiwum/$archive_slug/index.html;
        add_header Cache-Control "no-cache";
    }

    # Popularne żądanie przeglądarek — korzystamy z ikony opartej na oficjalnym logo.
    location = /favicon.ico {
        alias /usr/share/nginx/html/assets/favicon-64.png;
        default_type image/png;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        default_type application/xml;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(?:css|js)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location ~* \.(?:webp|png|jpg|jpeg|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
