server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    # Migracja archiwum: stara treść index.html może zawierać adresy dawnego CDN,
    # ale odpowiedź produkcyjna podmienia je na pliki przechowywane lokalnie.
    sub_filter_once off;
    sub_filter 'https://horizons-cdn.hostinger.com/53e9a500-da39-4477-9810-736be7d3a16f/kolorowy-uroczy-boa1-4e-narodzenie-promocja-sklep-z-zabawkami-post-na-facebooka-3ehdt.png' '/assets/archiwum/swiateczne-paczki.webp';
    sub_filter 'https://horizons-cdn.hostinger.com/53e9a500-da39-4477-9810-736be7d3a16f/bc86976c-589b-4a75-b20f-4c08c55dca5a-7N0HH.JPG' '/assets/archiwum/plecak-pelen-odwagi.webp';
    sub_filter 'https://horizons-cdn.hostinger.com/53e9a500-da39-4477-9810-736be7d3a16f/powodz-zSRof.png' '/assets/archiwum/pomoc-po-powodzi.webp';
    sub_filter 'https://horizons-cdn.hostinger.com/53e9a500-da39-4477-9810-736be7d3a16f/1c189e08ead9c54f68fede53452180d5.jpg' '/assets/akcja-fundacji-dary.webp';
    sub_filter 'https://horizons-cdn.hostinger.com/53e9a500-da39-4477-9810-736be7d3a16f/122081517db63b7baa60fe9bd38acc8d.jpg' '/assets/akcja-fundacji-dary.webp';
    sub_filter 'https://horizons-cdn.hostinger.com/53e9a500-da39-4477-9810-736be7d3a16f/354e495f5aa489d8b8fa74cb3546049e.jpg' '/assets/archiwum/swiateczne-paczki.webp';
    sub_filter 'https://horizons-cdn.hostinger.com/53e9a500-da39-4477-9810-736be7d3a16f/bf09ffb91ae4511f8ac216385449aee0.jpg' '/assets/archiwum/swiateczne-paczki.webp';
    sub_filter 'https://horizons-cdn.hostinger.com/53e9a500-da39-4477-9810-736be7d3a16f/92fa85bf95ccb1ce221276101b8de657.jpg' '/assets/akcja-fundacji-dary.webp';
    sub_filter 'https://horizons-cdn.hostinger.com/53e9a500-da39-4477-9810-736be7d3a16f/3d280ff8a84003ad1d8fe2d7ac5f16ca.jpg' '/assets/akcja-fundacji-grupa.webp';
    sub_filter 'https://horizons-cdn.hostinger.com/53e9a500-da39-4477-9810-736be7d3a16f/27d39b053b7560772601b90279e9d5a8.jpg' '/assets/akcja-fundacji-grupa.webp';
    sub_filter '<p class="archive-note">To materiały z archiwum Fundacji. Nie dopisujemy dat, liczb ani szczegółów, których nie mamy potwierdzonych.</p>' '<p class="archive-note">To materiały z archiwum Fundacji. Nie dopisujemy dat, liczb ani szczegółów, których nie mamy potwierdzonych. <a href="/archiwum"><strong>Otwórz pełne archiwum →</strong></a></p>';

    # Identyfikacja i podglądy społecznościowe.
    sub_filter '<meta property="og:description" content="Pomagamy w Polsce i poza jej granicami. Poznaj działania Fundacji i akcję Listy do Świętego Mikołaja.">' '<meta property="og:description" content="Pomagamy w Polsce i poza jej granicami. Poznaj działania Fundacji i akcję Listy do Świętego Mikołaja.">\n<meta property="og:image" content="https://fundacjalepszydomlepszejutro.pl/assets/akcja-fundacji-grupa.webp">\n<meta property="og:image:alt" content="Archiwalne zdjęcie z działań Fundacji Lepszy Dom Lepsze Jutro">';
    sub_filter '</head>' '<link rel="icon" href="/favicon.svg" type="image/svg+xml">\n<link rel="manifest" href="/site.webmanifest">\n</head>';

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /archiwum {
        try_files /archiwum.html =404;
    }

    location = /archiwum/ {
        return 301 /archiwum;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
