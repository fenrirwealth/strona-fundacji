server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Language "pl" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    # Przekierowania opierają się na oryginalnym żądaniu, więc nie kolidują
    # z wewnętrznym serwowaniem plików HTML przez nginx.
    if ($request_uri = "/index.html") { return 301 /; }
    if ($request_uri = "/archiwum.html") { return 301 /archiwum; }
    if ($request_uri = "/archiwum/index.html") { return 301 /archiwum; }
    if ($request_uri = "/listy-do-swietego-mikolaja.html") { return 301 /listy-do-swietego-mikolaja; }
    if ($request_uri = "/o-fundacji.html") { return 301 /o-fundacji; }
    if ($request_uri = "/kontakt.html") { return 301 /kontakt; }
    if ($request_uri = "/polityka-prywatnosci.html") { return 301 /polityka-prywatnosci; }
    if ($request_uri ~ ^(/archiwum/[^/]+)/index\.html$) { return 301 $1; }

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /404.html {
        internal;
    }

    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location = /index.html {
        expires -1;
    }

    location = /archiwum {
        try_files /archiwum.html =404;
        expires -1;
    }

    location = /archiwum.html {
        expires -1;
    }

    location = /archiwum/ {
        return 301 /archiwum;
    }

    location = /listy-do-swietego-mikolaja {
        try_files /listy-do-swietego-mikolaja.html =404;
        expires -1;
    }

    location = /listy-do-swietego-mikolaja.html {
        expires -1;
    }

    location = /listy-do-swietego-mikolaja/ {
        return 301 /listy-do-swietego-mikolaja;
    }

    location = /o-fundacji {
        try_files /o-fundacji.html =404;
        expires -1;
    }

    location = /o-fundacji.html {
        expires -1;
    }

    location = /o-fundacji/ {
        return 301 /o-fundacji;
    }

    location = /kontakt {
        try_files /kontakt.html =404;
        expires -1;
    }

    location = /kontakt.html {
        expires -1;
    }

    location = /kontakt/ {
        return 301 /kontakt;
    }

    location = /polityka-prywatnosci {
        try_files /polityka-prywatnosci.html =404;
        expires -1;
    }

    location = /polityka-prywatnosci.html {
        expires -1;
    }

    location = /polityka-prywatnosci/ {
        return 301 /polityka-prywatnosci;
    }

    location ~ ^(/archiwum/[^/]+)/$ {
        return 301 $1;
    }

    location ~ ^/archiwum/[^/]+$ {
        try_files $uri/index.html =404;
        expires -1;
    }

    location = /favicon.ico {
        return 302 /assets/favicon-64.png;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1h;
    }

    location = /robots.txt {
        expires 1h;
    }

    location = /sitemap.xml {
        default_type application/xml;
        expires 1h;
    }

    location ~* \.(?:css|js)$ {
        expires 1d;
        try_files $uri =404;
    }

    location ~* \.(?:webp|png|jpg|jpeg|svg)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
