name: Kontrola jakosci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  strona:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.mjs
      - run: docker build --tag strona-fundacji:ci .
      - name: Sprawdz konfiguracje nginx
        run: docker run --rm strona-fundacji:ci nginx -t
      - name: Sprawdz obraz, linkowanie i SEO
        run: |
          set -euxo pipefail
          docker run -d --name strona-fundacji-ci -p 18080:8080 strona-fundacji:ci
          trap 'docker rm -f strona-fundacji-ci >/dev/null 2>&1 || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:18080/healthz | grep -qx 'ok'
          curl -fsS http://127.0.0.1:18080/ > /tmp/index.html
          curl -fsSI http://127.0.0.1:18080/ | tr -d '\r' > /tmp/index.headers
          curl -fsS -H 'Accept-Encoding: gzip' -D /tmp/gzip.headers -o /dev/null http://127.0.0.1:18080/
          tr -d '\r' < /tmp/gzip.headers > /tmp/gzip.clean
          curl -fsS http://127.0.0.1:18080/archiwum > /tmp/archiwum.html
          curl -fsS http://127.0.0.1:18080/listy-do-swietego-mikolaja > /tmp/mikolaj.html
          curl -fsS http://127.0.0.1:18080/o-fundacji > /tmp/about.html
          curl -fsS http://127.0.0.1:18080/kontakt > /tmp/contact.html
          curl -fsS http://127.0.0.1:18080/polityka-prywatnosci > /tmp/privacy.html
          curl -fsS http://127.0.0.1:18080/robots.txt > /tmp/robots.txt
          curl -fsS http://127.0.0.1:18080/sitemap.xml > /tmp/sitemap.xml
          grep -q '/assets/logo-fundacji.webp' /tmp/index.html
          grep -q 'twitter:card' /tmp/index.html
          ! grep -q 'horizons-cdn.hostinger.com' /tmp/index.html
          ! grep -q 'fonts.googleapis.com' /tmp/index.html
          ! grep -q 'fonts.gstatic.com' /tmp/index.html
          grep -q '/_next/static/' /tmp/index.html
          grep -q 'Każdy gest ma siłę' /tmp/index.html
          grep -qi '^content-language: pl$' /tmp/index.headers
          grep -qi '^cache-control: no-cache$' /tmp/index.headers
          grep -qi "^content-security-policy:.*style-src 'self' 'unsafe-inline'; font-src 'self';" /tmp/index.headers
          grep -qi '^content-encoding: gzip$' /tmp/gzip.clean
          grep -q 'Listy do Świętego Mikołaja' /tmp/mikolaj.html
          grep -q 'FAQPage' /tmp/mikolaj.html
          grep -q 'portal.fundacjalepszydomlepszejutro.pl' /tmp/mikolaj.html
          grep -q 'O Fundacji' /tmp/about.html
          grep -q 'KRS 0000971976' /tmp/about.html
          grep -q '+48 570 747 779' /tmp/contact.html
          grep -q 'krojów pisma dostępnych w systemie użytkownika' /tmp/privacy.html
          ! grep -q 'fonts.googleapis.com' /tmp/privacy.html
          grep -q '^Sitemap: https://fundacjalepszydomlepszejutro.pl/sitemap.xml$' /tmp/robots.txt
          grep -q '<loc>https://fundacjalepszydomlepszejutro.pl/o-fundacji</loc>' /tmp/sitemap.xml
          for path in swiateczne-paczki plecak-pelen-odwagi pomoc-po-powodzi zebrane-dary za-kulisami-dzialan; do
            curl -fsS "http://127.0.0.1:18080/archiwum/$path" | grep -q 'Materiał archiwalny'
          done
          curl -fsS http://127.0.0.1:18080/site.webmanifest | grep -q 'icon-192.png'
          curl -fsS http://127.0.0.1:18080/site.webmanifest | grep -q '"lang": "pl"'
          curl -fsS http://127.0.0.1:18080/assets/logo-fundacji.webp >/dev/null
          curl -fsS http://127.0.0.1:18080/assets/pages.css >/dev/null
          curl -fsS http://127.0.0.1:18080/assets/performance-v7.css | grep -q -- '--font-sans'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/favicon.ico)" = "302"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/index.html)" = "301"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/archiwum.html)" = "301"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/archiwum/)" = "301"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/listy-do-swietego-mikolaja.html)" = "301"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/listy-do-swietego-mikolaja/)" = "301"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/o-fundacji.html)" = "301"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/o-fundacji/)" = "301"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/kontakt.html)" = "301"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/kontakt/)" = "301"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/polityka-prywatnosci.html)" = "301"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/polityka-prywatnosci/)" = "301"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/archiwum/swiateczne-paczki/index.html)" = "301"
          test "$(curl -s -o /tmp/404.html -w '%{http_code}' http://127.0.0.1:18080/nie-ma-takiej-strony)" = "404"
          grep -q 'Ta strona nie istnieje' /tmp/404.html
