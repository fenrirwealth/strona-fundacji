name: Kontrola jakosci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  strona:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.mjs
      - run: docker build --tag strona-fundacji:ci .
